# TENDRIX — full stack. `cp .env.docker.example .env.docker && docker compose up -d --build`
# then open http://localhost:8080. `make up` generates the secrets; `make demo` also loads demo data (local only).

x-api: &api
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: tendrix/api:latest
  env_file: [.env.docker]
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-tendrix}:${POSTGRES_PASSWORD:-tendrix}@database:5432/${POSTGRES_DB:-tendrix}?serverVersion=16&charset=utf8
    REDIS_URL: redis://redis:6379
  volumes:
    - jwt_keys:/app/config/jwt
  depends_on:
    database: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  api:
    <<: *api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tendrix}:${POSTGRES_PASSWORD:-tendrix}@database:5432/${POSTGRES_DB:-tendrix}?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "1"

  worker:
    <<: *api
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    depends_on:
      api: { condition: service_started }

  scheduler:
    <<: *api
    # Closes tenders whose response deadline has passed, every 5 minutes.
    command: ["sh", "-c", "while true; do php bin/console app:tenders:close-expired --no-interaction; sleep 300; done"]
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: tendrix/web:latest
    ports: ["${HTTP_PORT:-8080}:8080"]
    depends_on: [api]
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tendrix}
      POSTGRES_USER: ${POSTGRES_USER:-tendrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tendrix}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-tendrix}"]
      interval: 5s
      retries: 10
    volumes: [database_data:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  database_data:
  jwt_keys:
