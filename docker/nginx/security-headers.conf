# Included in the server block AND in every location that sets its own headers: nginx drops
# inherited add_header directives as soon as a location declares one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Scripts: same origin only, plus the theme bootstrap script in index.html allowed by its hash
# (computed from the built index.html when the image is built, see docker/nginx/Dockerfile). No inline event handlers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' '__THEME_SCRIPT_HASH__'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
