# Defense in depth in front of Symfony's own login throttling and sign-up limiter.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json application/ld+json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Never serve dotfiles or source maps.
    location ~ /\. { deny all; }
    location ~* \.map$ { deny all; }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/php-api.conf;
    }

    # API (Symfony front controller on PHP-FPM).
    location /api {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/php-api.conf;
    }

    # Hashed SPA assets are immutable.
    location ~* \.(js|css|woff2?|svg|png|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # Angular router: everything else serves index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
