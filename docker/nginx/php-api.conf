fastcgi_pass api:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /app/public/index.php;
fastcgi_param DOCUMENT_ROOT /app/public;
fastcgi_param HTTPS $https if_not_empty;
# Never let a client-supplied Proxy header reach PHP (httpoxy).
fastcgi_param HTTP_PROXY "";
# Symfony trusts this proxy (TRUSTED_PROXIES): overwrite the forwarding headers instead of passing the
# client's own values, otherwise anyone could spoof their IP and bypass per-IP rate limits.
# Behind another load balancer, replace $remote_addr/$scheme with that balancer's trusted values.
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
fastcgi_param HTTP_X_FORWARDED_HOST $host;
fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
fastcgi_read_timeout 120s;
