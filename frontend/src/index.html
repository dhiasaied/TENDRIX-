<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TENDRIX</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TENDRIX — plateforme d'achats de prestations intellectuelles : appels d'offres, matching IA, contrats, facturation et performance fournisseurs.">
  <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the stored theme before first paint (see ThemeService).
    (function () {
      var c = 'system';
      try { c = localStorage.getItem('tendrix.theme') || 'system'; } catch (e) {}
      var dark = c === 'dark' || (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>TENDRIX nécessite JavaScript.</noscript>
</body>
</html>
